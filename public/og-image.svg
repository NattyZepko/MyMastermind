<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Natty Mastermind">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0b0b0b" />
			<stop offset="1" stop-color="#111111" />
		</linearGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="10" result="blur" />
			<feMerge>
				<feMergeNode in="blur" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)" />

	<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" fill="#ffffff">
		<text x="90" y="190" font-size="78" font-weight="800">Natty Mastermind</text>
		<text x="90" y="262" font-size="34" opacity="0.9">Beat today's Daily Challenge</text>
		<text x="90" y="312" font-size="34" opacity="0.9">Play custom games</text>
		<text x="90" y="372" font-size="28" opacity="0.75">Daily Challenge • Custom Difficulties • Classic Mode</text>
	</g>

	<g filter="url(#glow)">
		<rect x="820" y="165" width="320" height="320" rx="40" fill="#0b0b0b" stroke="#2a2a2a" stroke-width="3" />
		<g transform="translate(980 325)">
			<circle cx="0" cy="0" r="110" fill="#0b0b0b" />
			<circle cx="-58" cy="0" r="36" fill="#ef4444" />
			<circle cx="0" cy="0" r="36" fill="#3b82f6" />
			<circle cx="58" cy="0" r="36" fill="#22c55e" />
		</g>
	</g>
</svg>
